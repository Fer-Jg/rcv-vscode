<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="{{styleUri}}" rel="stylesheet" />
  </head>
  <body>
    <div class="sidebar">
      <div class="sidebar-content">
        <div class="logo">RCV - VSCode</div>
        <div class="description">Create and preview your CVs in VSCode</div>
        <button id="create-cv-button" class="create-button" type="button">
          <span class="plus-icon">
            <svg
              width="14"
              height="14"
              viewBox="0 0 14 14"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M7 1V13M1 7H13"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
          </span>
          Create new CV
        </button>

        <div class="section-label">CVs</div>

        <ul id="cv-list" class="cv-list">
          <!-- items injected by main.js -->
        </ul>
      </div>

      <a href="#" id="feedback-link" class="feedback-link">
        <svg
          width="14"
          height="14"
          viewBox="0 0 16 16"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M14.5 1.5L1 7.2L6.2 9.1M14.5 1.5L9.8 15L6.2 9.1M14.5 1.5L6.2 9.1"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Feedback
      </a>
    </div>

    <script src="{{scriptUri}}"></script>
  </body>
</html>
